name: CR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: read the code, write the review. Nothing else.
permissions:
  contents: read
  pull-requests: write

concurrency:
  # One review per PR. A new push cancels the in-flight run rather than
  # reviewing a SHA that no longer exists (PIPELINE.md §4.5).
  group: cr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs carry an untrusted head. `pull_request` gives a read-only token
    # and no secrets, so this job simply will not run for them — which is the
    # correct behaviour until the sandbox lands (BACKLOG.md CR-08..CR-13).
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the linters can see the whole tree.
          fetch-depth: 0

      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
