name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing tag to roll back to. Leave blank to build HEAD.'
        required: false

# One deploy at a time, and never cancelled halfway: an interrupted revision
# update can leave the web and worker revisions on different images.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  APP_NAME: ${{ vars.APP_NAME }}

permissions:
  id-token: write   # OIDC federation to Azure — no stored cloud credentials
  contents: read

jobs:
  build:
    if: vars.ACR_NAME != '' && vars.APP_NAME != '' && vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="$IMAGE_TAG"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          if ! [[ "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.ACR_NAME }}.azurecr.io/cr:$TAG" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A rollback names an image that already exists; rebuilding it would
      # produce a different digest for the same tag and defeat the point.
      - name: Skip build if the tag already exists
        id: exists
        run: |
          set -o pipefail
          if az acr repository show-tags -n "$ACR_NAME" --repository cr -o tsv 2>/dev/null \
             | grep -qx "${{ steps.meta.outputs.tag }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.found == 'false'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        if: steps.exists.outputs.found == 'false'
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        run: |
          az acr login --name "$ACR_NAME"
          docker build --file Dockerfile --tag "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The deployment identity can push to ACR and update these two apps only.
      # Infrastructure and secrets are applied separately with infra/main.bicep
      # by an Azure administrator; CI never receives the GitHub App private key.
      - name: Update the two Container Apps
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          az containerapp update --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME-worker" --image "${{ needs.build.outputs.image }}" --output none
          az containerapp update --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME-web" --image "${{ needs.build.outputs.image }}" --output none

      - name: Wait for the ingress to answer
        run: |
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME-web" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          URL="https://$FQDN"
          echo "Deployed: $URL"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the new revision never became healthy"
          # Surface why, rather than leaving someone to go hunting in the portal.
          az containerapp logs show -n "$APP_NAME-web" -g "$RESOURCE_GROUP" --tail 50 || true
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### CR deployment"
            echo ""
            echo "- image: \`${{ needs.build.outputs.image }}\`"
            echo "- webhook: \`https://$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME-web" --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null)/webhook\`"
            echo ""
            echo "Point the GitHub App's webhook URL at that address if it changed."
          } >> "$GITHUB_STEP_SUMMARY"
