[project]
name = "cr"
version = "0.1.0"
description = "High-precision AI code review agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "githubkit>=0.16.1",
    "httpx>=0.27",
    "unidiff>=1.0.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.20.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Postgres-backed deployments. Running the App on a laptop needs nothing beyond
# the base dependencies: SQLite store, in-process queue, cache on local disk.
store = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]
# The cloud-only dependencies: Postgres and the Service Bus queue. Git mirrors
# and review caches use the mounted Azure Files share.
azure = [
    "psycopg[binary]>=3.2",
    "azure-servicebus>=7.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
cr = "cr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cr"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom *is* a call in an argument default.
"src/cr/app/authroutes.py" = ["B008"]
# Sharing a fixture across test modules means importing a name pytest then
# rebinds as a parameter, which reads as a redefinition and is not one.
"tests/conftest.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
